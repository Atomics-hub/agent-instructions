name: Bug report
description: Report incorrect resolution, compatibility, or security behavior
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal instruction tree and target paths
      description: Remove secrets before posting repository content.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and Node.js versions
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Resolution or CLI output
    validations:
      required: true
